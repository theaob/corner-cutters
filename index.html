<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#15141f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Corner Cutters</title>
    <style>
      /* Pixel fonts, bundled (SIL Open Font License; see fonts/OFL-*.txt): Silkscreen for labels and
         headings, Pixelify Sans for in-game reading text (messages, calls, notifications, battle lines). */
      @font-face {
        font-family: 'Silkscreen';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(fonts/silkscreen.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Pixelify Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url(fonts/pixelify-sans.woff2) format('woff2');
      }
    </style>
    <style>
      :root {
        --deck: #15141f;
        --key: #25233a;
        --key-edge: #3a3858;
        --key-held: #3a3858;
        --muted: #9d9ab8;
        --text: #f4f2fa;
        --cash: #f2c14e;
        --accent-a: #ff4fd8;
        --accent-b: #5fe0d0;
        --pixel: 'Silkscreen', ui-monospace, monospace;
        /* in-game reading text (messages, calls, notifications, battle lines): a pixel font with lower case */
        --pixel-text: 'Pixelify Sans', 'Silkscreen', ui-monospace, monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e0d16;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #app {
        max-width: 430px;
        height: 100dvh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        background: var(--deck);
        color: var(--text);
        font-family: var(--pixel);
      }
      #screen {
        flex: none;
        margin: 0 auto;
        background: #000;
        position: relative;
      }
.demo-menu {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #111118;
        color: var(--text);
        font-family: var(--pixel);
      }
      .demo-menu h1 {
        margin: 0 0 6px;
        font-size: 17px;
        font-weight: 400;
        color: var(--cash);
      }
      .demo-menu ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .demo-menu button {
        width: 100%;
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid var(--key-edge);
        border-radius: 10px;
        background: var(--key);
        color: var(--text);
        font-family: var(--pixel);
        font-size: 15px;
        text-align: left;
      }
      .demo-menu button.selected {
        border-color: var(--accent-a);
        color: var(--accent-a);
      }
      .demo-menu p {
        margin: auto 0 0;
        font-family: system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.4;
        color: var(--muted);
      }
      .demo-menu p.hint {
        margin-top: 8px;
        font-family: inherit;
        font-size: 12px;
        letter-spacing: 1px;
        opacity: 0.7;
      }
      .tune-toggle {
        position: absolute;
        top: 6px;
        right: 6px;
        z-index: 2;
        padding: 4px 8px;
        border: 1px solid var(--key-edge);
        border-radius: 8px;
        background: rgba(21, 20, 31, 0.85);
        color: var(--cash);
        font-family: var(--pixel);
        font-size: 12px;
      }
      .tune-panel {
        position: absolute;
        top: 36px;
        left: 6px;
        right: 6px;
        z-index: 2;
        max-height: calc(100% - 44px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 10px;
        border-radius: 10px;
        background: rgba(21, 20, 31, 0.92);
        font-family: system-ui, sans-serif;
        font-size: 14px;
        color: var(--text);
      }
      .tune-panel.peeking {
        opacity: 0;
      }
      .tune-row {
        display: grid;
        grid-template-columns: 1fr 44px;
        gap: 2px 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .tune-row span {
        grid-column: 1 / 3;
        color: var(--muted);
      }
      .tune-row input {
        width: 100%;
      }
      .tune-row output {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .tune-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .tune-actions button {
        padding: 6px 12px;
        border: 1px solid var(--key-edge);
        border-radius: 8px;
        background: var(--key);
        color: var(--text);
      }
      /* car editor (?demo=cars): panel over the lower part of the screen, preview above */
      .car-editor {
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: 6px;
        top: 44%;
        z-index: 2;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(21, 20, 31, 0.92);
        font-family: system-ui, sans-serif;
        font-size: 14px;
        color: var(--text);
      }
      .car-editor[hidden] {
        display: none;
      }
      .ce-head {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .ce-head strong {
        flex: 1;
        text-align: center;
        font-family: var(--pixel);
        font-size: 14px;
        color: var(--cash);
      }
      .ce-tabs {
        display: flex;
        gap: 4px;
        margin: 6px 0;
      }
      .car-editor button {
        padding: 5px 9px;
        border: 1px solid var(--key-edge);
        border-radius: 8px;
        background: var(--key);
        color: var(--text);
        font: inherit;
      }
      .ce-tabs button {
        flex: 1;
        font-family: var(--pixel);
        font-size: 11px;
      }
      .car-editor button.on {
        border-color: var(--cash);
        color: var(--cash);
      }
      .ce-body {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
      }
      .ce-row {
        display: grid;
        grid-template-columns: 1fr 48px;
        gap: 0 8px;
        align-items: center;
        margin-bottom: 6px;
      }
      .ce-row span {
        grid-column: 1 / 3;
        color: var(--muted);
      }
      .ce-row input {
        width: 100%;
      }
      .ce-row output {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .ce-row output.changed {
        color: var(--cash);
      }
      .ce-swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }
      .ce-swatches button {
        width: 34px;
        height: 34px;
        padding: 0;
        border-width: 2px;
      }
      .ce-swatches button.on {
        border-color: var(--text);
        box-shadow: 0 0 0 2px var(--cash);
      }
      .ce-line {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
      }
      .ce-line input[type='color'] {
        width: 44px;
        height: 30px;
        padding: 0;
        border: 0;
        background: none;
      }
      .ce-note {
        color: var(--muted);
        margin: 0 0 8px;
      }
      .ce-actions {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
        margin-top: 6px;
      }
      .ce-actions .drive {
        margin-right: auto;
        border-color: var(--cash);
        color: var(--cash);
        font-family: var(--pixel);
        font-size: 12px;
      }
      #screen canvas {
        display: block;
      }
      #deck {
        flex: 1;
        display: flex;
        flex-direction: column;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        padding-bottom: env(safe-area-inset-bottom);
      }
      .strip {
        height: 40px;
        flex: none;
        box-sizing: border-box;
        padding: 0 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 2px solid var(--accent-a);
        border-bottom: 1px solid #2b2940;
        font-size: 13px;
        letter-spacing: 1px;
        color: var(--muted);
      }
      .strip .cash {
        margin-left: 10px;
        font-size: 17px;
        letter-spacing: 0;
        color: var(--cash);
      }
      .strip .clock {
        margin-left: 10px;
        font-size: 15px;
        letter-spacing: 0;
        color: var(--text);
      }
      /* an unread message on your phone: a dot on START */
      button[data-button='start'].unread {
        position: relative;
      }
      button[data-button='start'].unread::after {
        content: '';
        position: absolute;
        top: -3px;
        right: -3px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent-a);
        box-shadow: 0 0 8px var(--accent-a);
      }
      /* an incoming call: START shakes and glows in time with the phone's buzz (every 1.6 s, MECHANICS §4.9) */
      button[data-button='start'].ringing {
        border-color: var(--accent-b);
        color: var(--accent-b);
        box-shadow: 0 0 10px var(--accent-b);
        animation: start-ring 1.6s linear infinite;
      }
      @keyframes start-ring {
        0%, 36%, 100% { transform: rotate(0); }
        3%, 11%, 19%, 27% { transform: rotate(-9deg) scale(1.08); }
        7%, 15%, 23%, 31% { transform: rotate(9deg) scale(1.08); }
      }
      /* a text arrives: one pulse */
      button[data-button='start'].pinged:not(.ringing) {
        animation: start-ping 0.7s ease-out;
      }
      @keyframes start-ping {
        0% { transform: scale(1); box-shadow: 0 0 0 0 var(--accent-a); }
        30% { transform: scale(1.15); box-shadow: 0 0 12px 2px var(--accent-a); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 transparent; }
      }
      .heat {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .heat span[data-heat-pip] {
        width: 10px;
        height: 10px;
        background: #34324a;
      }
      .heat span[data-heat-pip].on:nth-child(odd) {
        background: #ff4b4b;
        box-shadow: 0 0 8px #ff4b4b;
      }
      .heat span[data-heat-pip].on:nth-child(even) {
        background: #4b8bff;
        box-shadow: 0 0 8px #4b8bff;
      }
      .controls {
        flex: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 22px;
      }
      .dpad {
        width: 132px;
        height: 132px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        touch-action: none;
      }
      .dpad span {
        background: var(--key);
        border: 1px solid var(--key-edge);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #a9a6c0;
      }
      .dpad .up { grid-area: 1 / 2; border-bottom: none; border-radius: 8px 8px 0 0; }
      .dpad .left { grid-area: 2 / 1; border-right: none; border-radius: 8px 0 0 8px; }
      .dpad .mid { grid-area: 2 / 2; border: none; }
      .dpad .right { grid-area: 2 / 3; border-left: none; border-radius: 0 8px 8px 0; }
      .dpad .down { grid-area: 3 / 2; border-top: none; border-radius: 0 0 8px 8px; }
      .dpad[data-held~='up'] .up,
      .dpad[data-held~='down'] .down,
      .dpad[data-held~='left'] .left,
      .dpad[data-held~='right'] .right {
        background: var(--key-held);
        color: var(--text);
      }
      .face {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      .face .col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .face .col.low {
        margin-top: 34px;
      }
      .face button {
        width: 62px;
        height: 62px;
        border-radius: 50%;
        border: none;
        font-family: var(--pixel);
        font-size: 18px;
        color: var(--deck);
        touch-action: none;
      }
      .face button.pressed {
        transform: translateY(2px);
        filter: brightness(0.85);
      }
      .face .a { background: var(--accent-a); }
      .face .b { background: var(--accent-b); }
      .face .label {
        font-size: 12px;
        color: var(--muted);
        min-height: 12px;
      }
      .sys {
        flex: none;
        height: 46px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 14px;
      }
      .sys button {
        width: 72px;
        height: 26px;
        border-radius: 13px;
        border: 1px solid var(--key-edge);
        background: var(--key);
        color: #a9a6c0;
        font-family: var(--pixel);
        font-size: 12px;
        touch-action: none;
      }
      .sys button.pressed {
        background: var(--key-held);
      }
      .sys button.layout {
        width: auto;
        padding: 0 10px;
        border-style: dashed;
        font-size: 11px;
        cursor: pointer;
      }
      .sys button.layout[hidden] {
        display: none;
      }

      /* ---- desktop (a mouse and no touch screen, or ?desktop; see src/ui/layout.ts):
         a wide screen filling the window, the deck laid over it as a HUD. Phones never get this class. */
      .desktop #app {
        max-width: none;
        justify-content: center;
        background: #0e0d16;
      }
      .desktop #deck {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: block;
        padding: 0;
        pointer-events: none;
      }
      /* battles bring their own HUD */
      .desktop #screen.in-battle #deck {
        display: none;
      }
      /* top centre: the demos' readouts sit top left and TUNE top right */
      .desktop .strip {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        white-space: nowrap;
        height: 36px;
        gap: 18px;
        border: 1px solid #2b2940;
        border-left: 3px solid var(--accent-a);
        border-radius: 8px;
        background: rgba(21, 20, 31, 0.82);
      }
      .desktop .dpad {
        display: none;
      }
      /* A and B as key prompts, bottom right: [Z] ENTER CAR  [X] RUN */
      .desktop .controls {
        position: absolute;
        right: 12px;
        bottom: 12px;
        padding: 0;
      }
      .desktop .face {
        flex-direction: row-reverse;
        align-items: center;
        gap: 10px;
      }
      .desktop .face .col,
      .desktop .face .col.low {
        flex-direction: row;
        margin: 0;
        gap: 8px;
        padding: 6px 10px 6px 6px;
        border-radius: 8px;
        background: rgba(21, 20, 31, 0.82);
      }
      .desktop .face .col:has(.label:empty) {
        display: none;
      }
      .desktop .face button {
        width: 30px;
        height: 30px;
        border-radius: 6px;
        font-size: 0;
        pointer-events: auto;
        cursor: pointer;
      }
      .desktop .face button::after {
        font-size: 14px;
      }
      .desktop .face .a::after {
        content: 'Z';
      }
      .desktop .face .b::after {
        content: 'X';
      }
      .desktop .face .label {
        min-height: 0;
        font-size: 13px;
        color: var(--text);
      }
      /* START / SELECT as keys, bottom left, with the move keys */
      .desktop .sys {
        position: absolute;
        left: 12px;
        bottom: 12px;
        height: auto;
        gap: 8px;
        align-items: center;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(21, 20, 31, 0.82);
        font-size: 11px;
        color: var(--muted);
      }
      .desktop .sys::before {
        content: 'ARROWS/WASD MOVE';
        margin-right: 4px;
      }
      .desktop .sys button {
        width: auto;
        height: 24px;
        padding: 0 8px;
        border-radius: 6px;
        font-size: 0;
        pointer-events: auto;
        cursor: pointer;
      }
      .desktop .sys button::after {
        font-size: 11px;
      }
      .desktop .sys button[data-button='start']::after {
        content: 'ENTER START';
      }
      .desktop .sys button[data-button='select']::after {
        content: 'BKSP SELECT';
      }
      .desktop .sys button.layout {
        font-size: 11px;
      }
      .desktop .sys button.layout::before {
        content: 'V ';
      }
      .desktop .tune-panel {
        right: auto;
        width: 340px;
      }
      .desktop .demo-menu {
        padding: 24px max(24px, calc(50% - 260px));
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="screen"></div>
      <div id="deck">
        <div class="strip">
          <div><span data-hud="district"></span><span class="cash" data-hud="cash">$0</span><span class="clock" data-hud="clock"></span></div>
          <div class="heat" aria-label="Heat">
            <span>HEAT</span>
            <span data-heat-pip></span><span data-heat-pip></span><span data-heat-pip></span><span data-heat-pip></span>
          </div>
        </div>
        <div class="controls">
          <div class="dpad" data-dpad aria-label="D-pad">
            <span class="up">&#9650;</span>
            <span class="left">&#9664;</span>
            <span class="mid"></span>
            <span class="right">&#9654;</span>
            <span class="down">&#9660;</span>
          </div>
          <div class="face">
            <div class="col low">
              <button class="b" data-button="b" aria-label="B">B</button>
              <span class="label" data-hud="label-b"></span>
            </div>
            <div class="col">
              <button class="a" data-button="a" aria-label="A">A</button>
              <span class="label" data-hud="label-a"></span>
            </div>
          </div>
        </div>
        <div class="sys">
          <button data-button="select">SELECT</button>
          <button data-button="start">START</button>
          <!-- layout switch (handheld <-> wide desktop), shown only with a mouse or trackpad; V does the same -->
          <button class="layout" data-layout hidden>WIDE</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
