<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#15141f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Corner Cutters</title>
  </head>
  <body>
    <div id="curtain" class="down"></div>
    <div id="app">
      <div id="screen"></div>
      <div id="deck">
        <div class="strip">
          <div><span data-hud="position"></span><span class="lap" data-hud="lap"></span></div>
        </div>
        <div class="controls">
          <!-- analogue thumbstick: the knob follows the thumb (data-dpad: the deck binds it) -->
          <div class="stick" data-dpad aria-label="Thumbstick">
            <span class="tick up">&#9650;</span>
            <span class="tick left">&#9664;</span>
            <span class="tick right">&#9654;</span>
            <span class="tick down">&#9660;</span>
            <span class="knob"></span>
          </div>
          <div class="face">
            <div class="col low idle">
              <button class="b" data-button="b" aria-label="b"><span class="icon" data-hud="icon-b"></span></button>
              <span class="label" data-hud="label-b"></span>
            </div>
            <div class="col idle">
              <button class="a" data-button="a" aria-label="a"><span class="icon" data-hud="icon-a"></span></button>
              <span class="label" data-hud="label-a"></span>
            </div>
          </div>
          <!-- STEER on a touch screen, in the stick's and A's places: the steering slider (its knob follows the thumb
               left and right) and the pedals (data-slider, data-pedal: the deck binds them) -->
          <div class="slider" data-slider aria-label="Steering">
            <span class="tick left">&#9664;</span>
            <span class="tick right">&#9654;</span>
            <span class="knob"></span>
          </div>
          <div class="pedals">
            <button class="pedal brake" data-pedal="brake" aria-label="Brake">BRAKE</button>
            <button class="pedal gas" data-pedal="gas" aria-label="Gas">GAS</button>
          </div>
        </div>
        <div class="sys">
          <button class="idle" data-button="select" aria-label="select"><span class="icon" data-hud="icon-select"></span><span data-hud="label-select"></span></button>
          <button class="idle" data-button="start" aria-label="start"><span class="icon" data-hud="icon-start"></span><span data-hud="label-start"></span></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
