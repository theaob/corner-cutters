<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#15141f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Corner Cutters</title>
    <style>
      /* Pixel font, bundled (SIL Open Font License; see fonts/OFL-Silkscreen.txt). */
      @font-face {
        font-family: 'Silkscreen';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/fonts/silkscreen.woff2) format('woff2');
      }
    </style>
    <style>
      :root {
        --deck: #15141f;
        --key: #25233a;
        --key-edge: #3a3858;
        --key-held: #3a3858;
        --muted: #9d9ab8;
        --text: #f4f2fa;
        --gold: #f2c14e;
        --accent-a: #ff4fd8;
        --accent-b: #5fe0d0;
        --pixel: 'Silkscreen', ui-monospace, monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e0d16;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #app {
        max-width: 430px;
        height: 100dvh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        background: var(--deck);
        color: var(--text);
        font-family: var(--pixel);
      }
      #screen {
        flex: none;
        margin: 0 auto;
        background: #000;
        position: relative;
      }
      /* the circuit menu, before a race */
      .circuit-menu {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
        background: #111118;
        color: var(--text);
        font-family: var(--pixel);
      }
      .circuit-menu h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 400;
        color: var(--gold);
        text-align: center;
      }
      .circuit-menu p {
        margin: 0 0 6px;
        font-size: 12px;
        letter-spacing: 1px;
        color: var(--muted);
        text-align: center;
      }
      .circuit-menu ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .circuit-menu button {
        width: 100%;
        min-height: 72px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--key-edge);
        border-radius: 10px;
        background: var(--key);
        color: var(--text);
        font-family: var(--pixel);
        text-align: left;
        cursor: pointer;
      }
      .circuit-menu button.selected {
        border-color: var(--accent-a);
        box-shadow: 0 0 0 1px var(--accent-a);
      }
      .circuit-menu button canvas {
        flex: none;
      }
      .circuit-menu strong {
        display: block;
        font-size: 15px;
        font-weight: 400;
      }
      .circuit-menu button.selected strong {
        color: var(--accent-a);
      }
      .circuit-menu span {
        font-size: 11px;
        color: var(--muted);
      }
      .desktop .circuit-menu {
        padding: 24px max(24px, calc(50% - 220px));
      }
      .tune-toggle {
        position: absolute;
        top: 6px;
        right: 6px;
        z-index: 2;
        padding: 4px 8px;
        border: 1px solid var(--key-edge);
        border-radius: 8px;
        background: rgba(21, 20, 31, 0.85);
        color: var(--gold);
        font-family: var(--pixel);
        font-size: 12px;
      }
      .tune-panel {
        position: absolute;
        top: 36px;
        left: 6px;
        right: 6px;
        z-index: 2;
        max-height: calc(100% - 44px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 10px;
        border-radius: 10px;
        background: rgba(21, 20, 31, 0.92);
        font-family: system-ui, sans-serif;
        font-size: 14px;
        color: var(--text);
      }
      .tune-panel.peeking {
        opacity: 0;
      }
      .tune-row {
        display: grid;
        grid-template-columns: 1fr 44px;
        gap: 2px 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .tune-row span {
        grid-column: 1 / 3;
        color: var(--muted);
      }
      .tune-row input {
        width: 100%;
      }
      .tune-row output {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .tune-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .tune-actions button {
        padding: 6px 12px;
        border: 1px solid var(--key-edge);
        border-radius: 8px;
        background: var(--key);
        color: var(--text);
      }
      #screen canvas {
        display: block;
      }
      #deck {
        flex: 1;
        display: flex;
        flex-direction: column;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        padding-bottom: env(safe-area-inset-bottom);
      }
      .strip {
        height: 40px;
        flex: none;
        box-sizing: border-box;
        padding: 0 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 2px solid var(--accent-a);
        border-bottom: 1px solid #2b2940;
        font-size: 13px;
        letter-spacing: 1px;
        color: var(--muted);
      }
      .strip .lap {
        margin-left: 10px;
        font-size: 17px;
        letter-spacing: 0;
        color: var(--gold);
      }
      .controls {
        flex: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 22px;
      }
      .dpad {
        width: 132px;
        height: 132px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        touch-action: none;
      }
      .dpad span {
        background: var(--key);
        border: 1px solid var(--key-edge);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #a9a6c0;
      }
      .dpad .up { grid-area: 1 / 2; border-bottom: none; border-radius: 8px 8px 0 0; }
      .dpad .left { grid-area: 2 / 1; border-right: none; border-radius: 8px 0 0 8px; }
      .dpad .mid { grid-area: 2 / 2; border: none; }
      .dpad .right { grid-area: 2 / 3; border-left: none; border-radius: 0 8px 8px 0; }
      .dpad .down { grid-area: 3 / 2; border-top: none; border-radius: 0 0 8px 8px; }
      .dpad[data-held~='up'] .up,
      .dpad[data-held~='down'] .down,
      .dpad[data-held~='left'] .left,
      .dpad[data-held~='right'] .right {
        background: var(--key-held);
        color: var(--text);
      }
      .face {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      .face .col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .face .col.low {
        margin-top: 34px;
      }
      .face button {
        width: 62px;
        height: 62px;
        border-radius: 50%;
        border: none;
        font-family: var(--pixel);
        font-size: 18px;
        color: var(--deck);
        touch-action: none;
      }
      .face button.pressed {
        transform: translateY(2px);
        filter: brightness(0.85);
      }
      .face .a { background: var(--accent-a); }
      .face .b { background: var(--accent-b); }
      .face .label {
        font-size: 12px;
        color: var(--muted);
        min-height: 12px;
      }
      .sys {
        flex: none;
        height: 46px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 14px;
      }
      .sys button {
        width: 72px;
        height: 26px;
        border-radius: 13px;
        border: 1px solid var(--key-edge);
        background: var(--key);
        color: #a9a6c0;
        font-family: var(--pixel);
        font-size: 12px;
        touch-action: none;
      }
      .sys button.pressed {
        background: var(--key-held);
      }
      .sys button.layout {
        width: auto;
        padding: 0 10px;
        border-style: dashed;
        font-size: 11px;
        cursor: pointer;
      }
      .sys button.layout[hidden] {
        display: none;
      }

      /* ---- desktop (a mouse and no touch screen, or ?desktop; see src/ui/layout.ts):
         a wide screen filling the window, the deck laid over it as a HUD. Phones never get this class. */
      .desktop #app {
        max-width: none;
        justify-content: center;
        background: #0e0d16;
      }
      .desktop #deck {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: block;
        padding: 0;
        pointer-events: none;
      }
      /* top centre: the race readouts sit top left and TUNE top right */
      .desktop .strip {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        white-space: nowrap;
        height: 36px;
        gap: 18px;
        border: 1px solid #2b2940;
        border-left: 3px solid var(--accent-a);
        border-radius: 8px;
        background: rgba(21, 20, 31, 0.82);
      }
      .desktop .dpad {
        display: none;
      }
      /* A and B as key prompts, bottom right: [Z] ENTER CAR  [X] RUN */
      .desktop .controls {
        position: absolute;
        right: 12px;
        bottom: 12px;
        padding: 0;
      }
      .desktop .face {
        flex-direction: row-reverse;
        align-items: center;
        gap: 10px;
      }
      .desktop .face .col,
      .desktop .face .col.low {
        flex-direction: row;
        margin: 0;
        gap: 8px;
        padding: 6px 10px 6px 6px;
        border-radius: 8px;
        background: rgba(21, 20, 31, 0.82);
      }
      .desktop .face .col:has(.label:empty) {
        display: none;
      }
      .desktop .face button {
        width: 30px;
        height: 30px;
        border-radius: 6px;
        font-size: 0;
        pointer-events: auto;
        cursor: pointer;
      }
      .desktop .face button::after {
        font-size: 14px;
      }
      .desktop .face .a::after {
        content: 'Z';
      }
      .desktop .face .b::after {
        content: 'X';
      }
      .desktop .face .label {
        min-height: 0;
        font-size: 13px;
        color: var(--text);
      }
      /* START / SELECT as keys, bottom left, with the move keys */
      .desktop .sys {
        position: absolute;
        left: 12px;
        bottom: 12px;
        height: auto;
        gap: 8px;
        align-items: center;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(21, 20, 31, 0.82);
        font-size: 11px;
        color: var(--muted);
      }
      .desktop .sys::before {
        content: 'ARROWS/WASD MOVE';
        margin-right: 4px;
      }
      .desktop .sys button {
        width: auto;
        height: 24px;
        padding: 0 8px;
        border-radius: 6px;
        font-size: 0;
        pointer-events: auto;
        cursor: pointer;
      }
      .desktop .sys button::after {
        font-size: 11px;
      }
      .desktop .sys button[data-button='start']::after {
        content: 'ENTER START';
      }
      .desktop .sys button[data-button='select']::after {
        content: 'BKSP SELECT';
      }
      .desktop .sys button.layout {
        font-size: 11px;
      }
      .desktop .sys button.layout::before {
        content: 'V ';
      }
      .desktop .tune-panel {
        right: auto;
        width: 340px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="screen"></div>
      <div id="deck">
        <div class="strip">
          <div><span data-hud="position"></span><span class="lap" data-hud="lap"></span></div>
        </div>
        <div class="controls">
          <div class="dpad" data-dpad aria-label="D-pad">
            <span class="up">&#9650;</span>
            <span class="left">&#9664;</span>
            <span class="mid"></span>
            <span class="right">&#9654;</span>
            <span class="down">&#9660;</span>
          </div>
          <div class="face">
            <div class="col low">
              <button class="b" data-button="b" aria-label="B">B</button>
              <span class="label" data-hud="label-b"></span>
            </div>
            <div class="col">
              <button class="a" data-button="a" aria-label="A">A</button>
              <span class="label" data-hud="label-a"></span>
            </div>
          </div>
        </div>
        <div class="sys">
          <button data-button="select">SELECT</button>
          <button data-button="start">START</button>
          <!-- layout switch (handheld <-> wide desktop), shown only with a mouse or trackpad; V does the same -->
          <button class="layout" data-layout hidden>WIDE</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
